<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Fonte da og-image.png (1200×630). Renderizada localmente com Chrome
       headless; o PNG versionado é o artefato, este arquivo é a receita. -->
  <!-- Receita não é conteúdo, mas o deploy sobe todo o `site/`: esta página
       responde 200 em flocks.live e não está no sitemap. Mesmo `noindex` do
       404.html, pela mesma razão. Um `Disallow` no robots.txt não serviria:
       ele proíbe rastrear, não indexar — e impediria o crawler de ler
       justamente este noindex. -->
  <meta name="robots" content="noindex">
  <style>
    @font-face {
      font-family: 'Space Grotesk';
      src: url('fonts/SpaceGrotesk-Medium.woff2') format('woff2');
      font-weight: 500;
    }
    @font-face {
      font-family: 'Poppins';
      src: url('fonts/Poppins-Regular.woff2') format('woff2');
      font-weight: 400;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: #111823; /* neutral.950 */
      color: #f0f3ff;      /* neutral.100 */
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px 80px;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      right: -220px;
      top: -220px;
      width: 640px;
      height: 640px;
      border-radius: 50%;
      background: radial-gradient(circle, rgb(79 70 229 / 45%), transparent 70%);
    }
    .mark { display: flex; align-items: center; gap: 20px; }
    .mark svg { display: block; }
    .wordmark {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      font-size: 44px;
      letter-spacing: -0.01em;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      font-size: 68px;
      line-height: 1.12;
      letter-spacing: -0.015em;
      max-width: 20ch;
    }
    h1 em { font-style: normal; color: #8582ff; } /* primary.400 */
    .sub {
      font-size: 30px;
      color: #a2a9b8; /* neutral.400 */
      margin-top: 18px;
    }
    .domain {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 30px;
      color: #a4a1ff; /* primary.300 */
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="mark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="72" height="72">
      <rect width="64" height="64" rx="14" fill="#4F46E5"/>
      <g fill="none" stroke="#F2EFFF" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 27 L23 20 L32 27" stroke-width="5"/>
        <path d="M32 40 L41 33 L50 40" stroke-width="5"/>
        <path d="M38 19 L44 14.5 L50 19" stroke-width="4"/>
      </g>
    </svg>
    <span class="wordmark">flocks</span>
  </div>
  <div>
    <h1>A Flutter design system built on <em>widgets.dart</em></h1>
    <p class="sub">No Material, no Cupertino — 135 components, one hex seed.</p>
  </div>
  <p class="domain">flocks.live</p>
</body>
</html>
