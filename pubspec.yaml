# Raiz do workspace — não é um pacote publicável, e não deve virar um.
#
# Existe por uma razão só: os adaptadores declaram `flocks: ^0.1.0`, e é o
# `workspace:` abaixo que faz o `pub` casar essa restrição com o membro local
# em vez de ir à rede. Sem isso, um clone deste repo compilaria os adaptadores
# contra a versão publicada, e uma mudança no core só apareceria para eles
# depois do publish seguinte.
#
# Os três `example/` entram na lista porque dependem dos pacotes locais e
# precisam compilar contra o código DESTE checkout, não contra a versão
# publicada — senão um exemplo poderia passar verde no CI usando uma API que a
# branch acabou de mudar. O do flocks_phosphor é também o harness que mede o
# tree-shaking das fontes.
#
# Eles não são enfeite de pontuação: `Package has an example` vale 10 pontos na
# análise do pub.dev, e o `flocks` e o `flocks_material` os perderam na 0.1.0
# por não terem um. Mas o motivo de existirem é anterior — um pacote sem
# exemplo obriga quem chega a montar o primeiro `runApp` por tentativa.
#
# O `flocks_mcp` é o único membro que NÃO depende de Flutter — é Dart puro, de
# propósito, porque se instala com `dart pub global activate`. Ele entra aqui
# assim mesmo: é `dart analyze` e `dart format` da raiz varrendo o workspace
# inteiro que o cobrem, e é o `pub get` daqui que resolve as deps dele num
# clone. Ser membro não lhe impõe Flutter — o `environment:` de cada membro é
# dele.
name: flocks_workspace
description: "Workspace do Flocks — o design system, os adaptadores de ícone e o servidor MCP."
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

workspace:
  - packages/flocks
  - packages/flocks/example
  # A demo de white-label (ROADMAP, Fase D). Entra aqui pelas mesmas duas razões
  # dos `example/`: ela depende do `flocks` e precisa compilar contra ESTE
  # checkout, senão a vitrine que vende o pacote poderia passar verde usando uma
  # API que a branch acabou de mudar. E é a membresia que a põe no alcance do
  # `dart analyze` e do `dart format` da raiz — o que importa mais aqui do que
  # nos outros membros, porque é o `analyze` que prova que o snippet exportado
  # compila.
  #
  # Não tem `example/` próprio: ela É o exemplo, e `publish_to: none` a mantém
  # fora do pub.dev.
  - packages/flocks_demo
  - packages/flocks_material
  - packages/flocks_material/example
  - packages/flocks_mcp
  - packages/flocks_phosphor
  - packages/flocks_phosphor/example
