name: CI

# CI dos sete pacotes do Flocks — o core, os quatro adaptadores de ícone, o
# servidor MCP e a demo, um step de suíte para cada um no `checks`. Herdada da
# `flutter-ui.yml` do monorepo de origem, com a mesma divisão e as mesmas
# cicatrizes — o que mudou é que aqui não há prefixo `tracked-app/`: a raiz do
# repo É a raiz do workspace.
#
# A divisão em jobs não é estética. O `checks` roda tudo menos golden, em
# Linux, que é barato e paralelizável. O `goldens` roda só os golden, em macOS,
# porque golden compara PIXEL e a rasterização de texto não é idêntica entre
# plataformas: as 302 baselines foram geradas em macOS arm64 e só fecham lá.
# `widgetbook` e `site` deployam em push na main. `mcpb-build` e `mcpb-release`
# acordam em tag `v*` e empacotam o servidor MCP como `.mcpb` num GitHub
# Release.

on:
  push:
    branches: [main]
    # O gatilho de release do `.mcpb` (jobs `mcpb-*`). Um push de tag também é
    # `event_name == 'push'`, por isso os jobs de deploy filtram por
    # `github.ref` — sem o filtro, tageá-la deployaria vitrine e site junto.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      force_site:
        description: 'Deployar site/ ignorando a guarda de diff'
        type: boolean
        default: false
        # A guarda do job `site` olha o diff do push, então um re-run do mesmo
        # commit sai com "site/ intacto" e não sobe nada. Isso é o certo no dia
        # a dia e é um beco sem saída quando o objeto na Storage Zone da Bunny
        # divergiu do repo — foi o caso da nav sem o link "Demo" em 2026-08-10,
        # em que a fonte estava correta e o `flocks.live/` servia uma versão
        # atrás. Sem esta chave, a única saída era um commit de mentirinha
        # dentro de `site/`.

jobs:
  checks:
    name: format · analyze · shellcheck · test · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ANTES do toolchain de propósito: shellcheck já vem na imagem do runner,
      # custa cerca de um segundo, e erro de shell não precisa esperar o Flutter
      # baixar para aparecer.
      #
      # O `conferir-edge.sh` nasceu sem passar por lint — na máquina em que ele
      # foi escrito, `command -v shellcheck` veio vazio (PR #21), e um script
      # que três jobs de deploy chamam não pode ficar nesse estado. `.github/
      # scripts/` é o único shell versionado do repo que não mora dentro de um
      # `run:`; os blocos inline seriam trabalho de `actionlint`, que é outra
      # ferramenta e outra conversa.
      - name: Lint dos scripts de shell
        run: shellcheck .github/scripts/*.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Resolver dependências (workspace)
        # Da raiz: é o `workspace:` do pubspec daqui que faz `flocks_phosphor` e
        # `flocks_material` resolverem `flocks` no membro local. Enquanto o
        # pacote não está no pub.dev, `pub get` dentro de um pacote isolado não
        # tem como resolver o `flocks: ^0.1.0` que eles declaram.
        run: flutter pub get

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Análise estática
        # Da raiz, e isso cobre os três pacotes — verificado por canário
        # (erro plantado no `flocks_material` reprova aqui).
        run: dart analyze

      - name: Testes + arquitetura (flocks)
        # Sem golden: eles têm job próprio, em macOS (ver `goldens` abaixo).
        run: flutter test --exclude-tags golden
        working-directory: packages/flocks

      - name: Validar metadados de componentes migrados
        run: dart run tool/validate_components.dart
        working-directory: packages/flocks

      # Os quatro adaptadores rodam separados, e não são formalidade: é aqui que
      # vive o teste de contrato cruzado ("todo `AppIconToken` tem mapeamento em
      # todo adaptador"). Ele é a razão de os pacotes estarem num repo só —
      # separados, só rodaria depois de publicar.
      #
      # Cada adaptador carrega a sua própria cópia da asserção: não há registro
      # central de providers a estender, e é a soma destes steps que faz o
      # contrato ser cobrado em todos.
      - name: Testes (flocks_phosphor)
        run: flutter test
        working-directory: packages/flocks_phosphor

      - name: Testes (flocks_material)
        run: flutter test
        working-directory: packages/flocks_material

      - name: Testes (flocks_cupertino)
        run: flutter test
        working-directory: packages/flocks_cupertino

      # Além do contrato, este roda os gates da fonte vendorizada: o gerado
      # contra o catálogo, o catálogo contra o pin, o sha256 dos artefatos em
      # disco e o glifo de cada codepoint na TTF.
      - name: Testes (flocks_lucide)
        run: flutter test
        working-directory: packages/flocks_lucide

      # `dart test`, e não `flutter test`: o `flocks_mcp` é Dart puro, sem
      # `flutter:` no `environment` — é isso que o mantém instalável por
      # `dart pub global activate`, e chamá-lo pelo runner do Flutter esconderia
      # o dia em que uma dependência de Flutter entrasse sem querer.
      #
      # A suíte cobre três coisas que nenhuma outra do repo cobre: o gate de
      # frescor do catálogo embarcado (a terceira aplicação do padrão, e a que
      # mais importa — sem ela o servidor entrega props velhas A UM MODELO, com
      # cara de fonte de verdade), o contrato das três tools contra o catálogo
      # real, e um teste ponta a ponta que sobe o BINÁRIO e conversa com ele por
      # stdin/stdout. Este último é o canário do pin `dart_mcp: ^0.5.2`.
      #
      # O `dart analyze` da raiz já cobre este pacote pelo workspace —
      # verificado por canário, como o do `flocks_material`: erro plantado em
      # `packages/flocks_mcp/lib/` reprova lá em cima.
      - name: Testes (flocks_mcp)
        run: dart test
        working-directory: packages/flocks_mcp

      # A demo é um app, não uma biblioteca, e a suíte dela cobre o que nenhuma
      # outra do repo cobre: o gate de rede que sustenta a promessa de que o
      # logo do visitante não sai da aba dele, o teste de arquitetura que
      # substitui aqui o do core (que só varre `lib/src` do `flocks`), as
      # invariantes do contrato de URL, e um gate de layout que monta as duas
      # telas em quatro viewports × duas tipografias — porque a FONTE é um eixo
      # que o visitante controla, e uma linha que cabia com Poppins estoura com
      # Space Grotesk.
      - name: Testes (flocks_demo)
        run: flutter test
        working-directory: packages/flocks_demo

  snippet:
    name: snippet (hosted)
    # O snippet que a demo entrega ao visitante compila contra o `flocks` do
    # PUB.DEV? Nenhum outro gate responde a isso, e a lacuna já custou uma
    # versão: durante a 0.1.1 a demo exportou código que emitia
    # `flippedSwatch(`, função que existia só na `[Unreleased]`. O
    # `brand_snippet_freshness_test` ficou verde o tempo todo, e com razão —
    # `packages/flocks` é membro do workspace e o artefato mora dentro dele,
    # então o `package:flocks/flocks.dart` que ele importa resolve para
    # `packages/flocks/lib/`, onde todo símbolo novo existe, publicado ou não.
    #
    # Este job é o único lugar do repo que sai do workspace: monta um pacote
    # descartável em `$RUNNER_TEMP`, declara o `flocks` HOSPEDADO, copia o
    # artefato para dentro e analisa. É literalmente a situação de quem colou o
    # snippet num projeto próprio.
    #
    # A versão é pinada EXATA na do pubspec, e não em `^0.1.0`: o que interessa
    # provar é que o snippet compila contra a versão que esta árvore diz ser, e
    # `^0.1.0` responderia sobre "a mais nova que existir", que é outra pergunta
    # e não é determinística.
    #
    # Daí a guarda de versão. Entre preparar um release e publicá-lo existe uma
    # janela — agora mesmo, com o pubspec na 0.1.2 e o pub.dev na 0.1.1 — em que
    # a versão pinada não é resolvível. Nessa janela o job PULA, dizendo no log
    # exatamente o que deixou de conferir. Pular declarando é honesto; um
    # `continue-on-error` seria o mesmo gate virado enfeite, e reprovar seria
    # exigir que o publish viesse antes do merge que o prepara.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: A versão desta árvore já está no pub.dev?
        id: published
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *//p' packages/flocks/pubspec.yaml | head -1)
          if [ -z "$version" ]; then
            echo '::error::não achei a chave version: em packages/flocks/pubspec.yaml'
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # `curl` explícito e `jq`, como o resto do arquivo: sem action de
          # terceiro no caminho de um job que depois roda `pub get`.
          if curl -sS -H 'Accept: application/vnd.pub.v2+json' \
            "https://pub.dev/api/packages/flocks" |
            jq -e --arg v "$version" 'any(.versions[]; .version == $v)' >/dev/null
          then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "flocks ${version} está no pub.dev — conferindo o snippet contra ela."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::flocks ${version} ainda NÃO está no pub.dev. O snippet exportado não foi conferido contra o pacote hospedado nesta execução — este job volta a valer no primeiro push depois do publish da ${version}."
          fi

      - name: O snippet exportado compila contra o flocks hospedado
        if: steps.published.outputs.found == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.published.outputs.version }}
          # FORA de `$GITHUB_WORKSPACE` de propósito: dentro do repo, o `pub`
          # subiria até o `workspace:` da raiz e resolveria o membro local — que
          # é exatamente o engano que este job existe para não cometer.
          PROBE: ${{ runner.temp }}/snippet-hosted
        run: |
          set -euo pipefail
          mkdir -p "${PROBE}/lib"
          cat > "${PROBE}/pubspec.yaml" <<EOF
          name: snippet_hosted_probe
          publish_to: none
          environment:
            sdk: ^3.12.0
          dependencies:
            flocks: ${VERSION}
            flutter:
              sdk: flutter
          EOF
          cp packages/flocks/test/support/exported_brand_snippet.dart "${PROBE}/lib/"
          cd "${PROBE}"
          flutter pub get
          # O artefato é uma biblioteca sem `main`, então o analisador é o
          # veredito inteiro: símbolo que não existe na versão publicada vira
          # `undefined_function` aqui, que foi o erro exato do caso da 0.1.1.
          dart analyze

  changelog:
    name: changelog (pub.dev)
    # A data que a seção do CHANGELOG anuncia é a data em que o pub.dev
    # RECEBEU a versão? Nenhum gate respondia a isso, e a lacuna já custou uma
    # correção inteira: cinco seções datavam versões que ninguém tinha visto, e
    # três datavam a 0.1.0 em 2026-08-05 quando ela saiu no dia 10 (PR #19). O
    # aviso do `dart pub publish` não ajuda — ele só confere que a versão nova
    # APARECE no arquivo, e nem roda em PR.
    #
    # Job, e não teste, pela mesma razão que o `snippet (hosted)` é job: esta é
    # a única pergunta do assunto que precisa de rede, e a suíte offline
    # (`packages/flocks/test/architecture/release_versioning_test.dart`) cobre
    # todo o resto. Um `flutter test` que falasse com o pub.dev reprovaria por
    # API fora do ar, que não é defeito deste repo.
    #
    # `curl` e `jq`, sem action de terceiro e sem Flutter — a pergunta é sobre
    # dois arquivos de texto e uma API pública.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: As datas dos CHANGELOGs são as datas de publicação
        shell: bash
        run: |
          set -euo pipefail

          corpo=$(mktemp)
          trap 'rm -f "$corpo"' EXIT

          pacotes=0
          conferidas=0
          falhas=0

          for pubspec in packages/*/pubspec.yaml; do
            if grep -qE '^publish_to:[[:space:]]*none[[:space:]]*$' "$pubspec"; then
              continue
            fi
            pacotes=$((pacotes + 1))
            nome=$(sed -n 's/^name:[[:space:]]*//p' "$pubspec" | head -1)
            changelog="$(dirname "$pubspec")/CHANGELOG.md"

            if [ ! -f "$changelog" ]; then
              echo "::error::${nome} é publicável e não tem CHANGELOG.md."
              falhas=$((falhas + 1))
              continue
            fi

            codigo=$(curl -sS -o "$corpo" -w '%{http_code}' \
              -H 'Accept: application/vnd.pub.v2+json' \
              "https://pub.dev/api/packages/${nome}")

            # 404 é resposta legítima aqui: o `flocks_cupertino` e o
            # `flocks_lucide` ainda não estrearam. O que este job cobra é que a
            # ISENÇÃO seja verdade — a suíte offline libera os dois da versão do
            # core lendo uma cláusula na prosa do pubspec deles, e é aqui que
            # essa cláusula encontra a fonte externa que a confirma ou desmente.
            if [ "$codigo" = '404' ]; then
              if tr '\n' ' ' < "$pubspec" | grep -q 'nunca foi publicado'; then
                echo "::notice::${nome} não está no pub.dev, e o pubspec dele declara isso. Nada a conferir — este pacote entra no gate no primeiro push depois da estreia."
              else
                echo "::error::${nome} não existe no pub.dev e o pubspec dele não declara que nunca foi publicado. Ou a cláusula caiu, ou o pacote mudou de nome e o gate perdeu o alvo."
                falhas=$((falhas + 1))
              fi
              continue
            fi

            if [ "$codigo" != '200' ]; then
              echo "::error::A API do pub.dev respondeu ${codigo} para ${nome}. Este gate não sabe a resposta e não vai fingir que sabe."
              falhas=$((falhas + 1))
              continue
            fi

            # `published` é ISO-8601 em UTC; os dez primeiros caracteres são o
            # dia. É esse dia que a seção tem de anunciar.
            while read -r versao publicada; do
              secao=$(sed -n "s/^## \[${versao}\] - \([0-9][0-9-]*\)\$/\1/p" "$changelog" | head -1)
              if [ -z "$secao" ]; then
                echo "::error::${nome} ${versao} está no pub.dev e não tem seção datada no CHANGELOG. Quem atualiza a dependência não tem onde ler o que mudou."
                falhas=$((falhas + 1))
              elif [ "$secao" != "$publicada" ]; then
                echo "::error::${changelog}: a seção ${versao} é datada ${secao} e o pub.dev recebeu essa versão em ${publicada} (UTC)."
                falhas=$((falhas + 1))
              else
                conferidas=$((conferidas + 1))
              fi
            done < <(jq -r '.versions[] | "\(.version) \(.published[0:10])"' "$corpo")

            # O caminho inverso: a versão que a árvore já preparou e ninguém
            # publicou ainda. É a mesma janela que o `snippet (hosted)` conhece,
            # e a resposta é a mesma — PULAR DECLARANDO. Reprovar seria exigir
            # que o publish viesse antes do merge que o prepara, e calar seria
            # deixar a impressão de que a data foi conferida.
            while read -r versao; do
              if ! jq -e --arg v "$versao" 'any(.versions[]; .version == $v)' "$corpo" >/dev/null; then
                echo "::notice::${nome} ${versao} está no CHANGELOG e ainda não no pub.dev. A data dela não foi conferida contra fonte externa nesta execução — volta a valer no primeiro push depois do publish."
              fi
            # Só as seções DATADAS: o rodapé sem data é marco interno anterior
            # à primeira publicação (o `## [1.0.0]` do core), e prometer que ele
            # "volta a valer depois do publish" seria mentira — ele nunca vai
            # ao pub.dev.
            done < <(sed -n 's/^## \[\([0-9][0-9.]*\)\] - [0-9-]*$/\1/p' "$changelog")
          done

          # Contra o verde por vacuidade: se o glob não casar nada, ou se o
          # `publish_to: none` passar a valer para todo mundo, este job passaria
          # sem ter olhado um arquivo sequer.
          if [ "$pacotes" -eq 0 ]; then
            echo "::error::Nenhum pacote publicável em packages/ — não há o que conferir, e isso não é aprovação."
            exit 1
          fi

          if [ "$falhas" -gt 0 ]; then
            echo "::error::${falhas} divergência(s) entre os CHANGELOGs e o pub.dev."
            exit 1
          fi
          echo "${pacotes} pacote(s) publicável(is); ${conferidas} data(s) de seção conferida(s) contra o published do pub.dev."

  goldens:
    name: goldens (macOS)
    # Runner PINADO, não `macos-latest`: trocar a imagem troca o rasterizador
    # de texto, e uma baseline de 302 imagens não pode mudar de referência
    # porque o GitHub promoveu a `latest` numa terça-feira.
    #
    # `macos-26` (arm64) porque é onde as baselines são geradas. No monorepo
    # isto esteve em `macos-15` e o job nunca passou verde, com a causa
    # invisível: 302 imagens vermelhas sem nada dizendo "a imagem não é a
    # mesma". O passo abaixo passou a dizer.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Conferir que a imagem bate com a das baselines
        # Uma linha, antes de rodar teste nenhum, em vez de 302 falhas de pixel
        # sem causa aparente. Ao subir o pin, regere as baselines na imagem nova
        # (`flutter test --tags golden --update-goldens`) no MESMO commit.
        run: |
          esperado=26
          atual=$(sw_vers -productVersion | cut -d. -f1)
          arco=$(uname -m)
          echo "runner: macOS $atual ($arco) · baselines: macOS $esperado (arm64)"
          if [ "$atual" != "$esperado" ] || [ "$arco" != "arm64" ]; then
            echo "::error::As baselines de golden foram geradas em macOS $esperado/arm64, e este runner é macOS $atual/$arco. O rasterizador difere, então TODA comparação de pixel vai falhar por um motivo que não é o código. Alinhe o \`runs-on\` ou regere as baselines."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Resolver dependências (workspace)
        run: flutter pub get

      - name: Goldens (flocks)
        # As fontes reais entram por `FontLoader` e os ícones são estubados no
        # `test/flutter_test_config.dart` — é o que tira do caminho as duas
        # fontes de variação entre máquinas (fonte do sistema e rede).
        run: flutter test --tags golden
        working-directory: packages/flocks

      - name: Imagens da divergência
        # Sem isto, um golden vermelho na CI é indiagnosticável: a mensagem diz
        # que os bytes diferem e não mostra o quê. O `flutter_test` grava
        # master/test/isolatedDiff em `failures/` — é o que a triagem usa.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: packages/flocks/test/**/failures/**
          retention-days: 14
          if-no-files-found: ignore

  widgetbook:
    name: widgetbook (deploy)
    # Publica o catálogo em widgetbook.flocks.live (ROADMAP, Fase B). Só em
    # push na main — `pull_request` não deploya e não recebe os secrets — e só
    # depois dos dois gates verdes: a vitrine sobe em lockstep com o código,
    # nunca à frente dele.
    #
    # O upload é `find` + `curl` explícitos, sem action de terceiro: a Storage
    # Zone é escrita com uma senha, e a superfície de supply chain fica a
    # mínima. Caveat aceito: o job só sobe e sobrescreve — não apaga órfãos da
    # Storage Zone. Arquivo que o build parou de emitir continua servido até
    # alguém limpar à mão no painel.
    #
    # `github.ref`, e não `event_name == 'push'`: push de TAG também é push, e
    # o release do `.mcpb` não deve redeployar a vitrine.
    if: github.ref == 'refs/heads/main'
    needs: [checks, goldens]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Resolver dependências (workspace)
        run: flutter pub get

      - name: Gerar directories e buildar release
        # O `main.directories.g.dart` é versionado, mas regerar aqui garante
        # que o deploy reflete a fonte mesmo se alguém esqueceu o build_runner
        # — o catálogo publicado nunca fica atrás das anotações.
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter build web --release -t widgetbook/main.dart
        working-directory: packages/flocks

      - name: Subir build para a Storage Zone
        # Endpoint REGIONAL (br.) — a zone vive em São Paulo; o host genérico
        # da doc não aceita a escrita. Cada PUT tem o código HTTP conferido:
        # upload parcial tem que ser vermelho, não verde.
        shell: bash
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: |
          set -euo pipefail
          cd packages/flocks/build/web
          total=0
          while IFS= read -r -d '' f; do
            path="${f#./}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
              -H "AccessKey: ${BUNNY_STORAGE_PASSWORD}" \
              --data-binary "@${f}" \
              "https://br.storage.bunnycdn.com/flocks-widgetbook/${path}")
            if [ "$code" != "201" ]; then
              echo "::error::PUT ${path} -> HTTP ${code}"
              exit 1
            fi
            total=$((total + 1))
          done < <(find . -type f -print0)
          echo "Enviados ${total} arquivo(s) para flocks-widgetbook."

      - name: Purgar cache da Pull Zone
        # O `main.dart.js` não tem hash no nome e o edge cacheia por 1 ano —
        # sem purge, o deploy só existiria na origem. A chave de conta só serve
        # para isto; a escrita usa a senha da Storage Zone, acima.
        id: purge
        shell: bash
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          set -euo pipefail
          zone_id=$(curl -sS -H "AccessKey: ${BUNNY_API_KEY}" \
            "https://api.bunny.net/pullzone" |
            jq '[.[] | select(any(.Hostnames[]; .Value == "widgetbook.flocks.live"))][0].Id')
          if [ -z "$zone_id" ] || [ "$zone_id" = "null" ]; then
            echo "::error::Nenhuma Pull Zone com o hostname widgetbook.flocks.live."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "AccessKey: ${BUNNY_API_KEY}" \
            "https://api.bunny.net/pullzone/${zone_id}/purgeCache")
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::error::Purge da zone ${zone_id} -> HTTP ${code}"
            exit 1
          fi
          # O passo seguinte repurga entre tentativas, e precisa do id sem
          # redescobri-lo por hostname a cada volta.
          echo "zone_id=${zone_id}" >> "$GITHUB_OUTPUT"
          echo "Pull Zone ${zone_id} purgada."

      - name: Conferir que o edge serve o que subiu
        # O mesmo gate do `site`, pelo mesmo script — e aqui ele faltava por
        # inteiro: este job purgava a Pull Zone um segundo depois do último PUT e
        # terminava VERDE sem olhar o que widgetbook.flocks.live passou a servir,
        # que é o gesto exato que o script narra como causa do incidente de
        # 2026-08-10.
        #
        # A lista é o `index.html` e os `*.js` que o build emite na raiz — o
        # bootstrap, o loader, o `main.dart.js`, o service worker se houver.
        # Derivada, e não fixa: um rename do Flutter num upgrade não pode fazer o
        # passo conferir nada em silêncio. São eles porque são os que mudam em
        # TODO deploy e os que o edge cacheia por um ano sem hash no nome — a
        # razão de o purge existir. O resto do build são 43 MB de canvaskit e
        # fontes que não mudam entre deploys: conferi-los byte a byte custaria
        # ~390 MB de download nas oito tentativas do orçamento, sem cobrir risco
        # novo.
        shell: bash
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          ZONE_ID: ${{ steps.purge.outputs.zone_id }}
          EDGE_DICA: >-
            Réplica divergente na Storage Zone flocks-widgetbook é o suspeito —
            confira no painel da Bunny antes de re-rodar o job.
        run: |
          set -euo pipefail
          dir=packages/flocks/build/web
          if [ ! -f "${dir}/index.html" ]; then
            echo "::error::${dir}/index.html não existe — o build mudou de forma e este gate ficaria conferindo o vazio."
            exit 1
          fi
          pares=''
          while IFS= read -r -d '' f; do
            rel="${f#"${dir}"/}"
            url="/${rel}"
            case "$url" in
              */index.html) url="${url%index.html}" ;;
            esac
            pares="${pares}${url}|${f} "
          done < <(find "$dir" -maxdepth 1 -type f \
            \( -name 'index.html' -o -name '*.js' \) -print0)
          printf '%s' "$pares" |
            bash .github/scripts/conferir-edge.sh \
              https://widgetbook.flocks.live "${ZONE_ID}"

  demo:
    name: demo (deploy)
    # Publica a demo de white-label em flocks.live/demo/ (ROADMAP, Fase D).
    # Mesmo molde do `widgetbook` — só em push na main, depois dos dois gates
    # verdes, upload por find+curl explícito sem action de terceiro — com uma
    # diferença que exige cuidado: esta NÃO tem host próprio.
    #
    # Ela vai para a MESMA Storage Zone do site (`flocks-site`), sob o prefixo
    # `demo/`. O job `site` sobe `site/` para a RAIZ dessa zone, e os dois
    # convivem porque nenhum dos dois apaga órfãos e porque o prefixo aqui é
    # LITERAL na URL do curl: não há caminho por onde este job escreva fora de
    # `demo/`, nem mesmo se o build emitir um arquivo com nome esquisito.
    #
    # `needs` nos dois gates, ao contrário do `site`: o site é HTML estático e
    # não depende do Dart, mas a demo É o Dart — publicá-la à frente de um teste
    # vermelho seria publicar a vitrine de um design system quebrado.
    if: github.ref == 'refs/heads/main'
    needs: [checks, goldens]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Resolver dependências (workspace)
        run: flutter pub get

      - name: Buildar release
        # `--base-href /demo/` porque a demo é servida num subcaminho, e não na
        # raiz de um host próprio como o Widgetbook. O `web/index.html` mantém o
        # placeholder `$FLUTTER_BASE_HREF` justamente para isto: fixar `/demo/`
        # no arquivo quebraria o `flutter run -d chrome` do desenvolvimento sem
        # mudar nada no que é publicado.
        #
        # `--no-web-resources-cdn` NÃO é otimização — é a correção de um defeito
        # que só apareceu ao abrir a demo num navegador de verdade e ler as
        # requisições. O default do Flutter (`--web-resources-cdn`, ligado) puxa
        # `canvaskit.js` e `canvaskit.wasm` de `www.gstatic.com` a cada
        # carregamento. Numa demo cuja tese é "funciona offline, sem CDN, sem
        # conta de terceiro", isso é a própria tese sendo desmentida na aba de
        # rede — e uma requisição a um servidor do Google que o visitante não
        # pediu. Com a flag, o `canvaskit/` que já vai no build é servido da
        # nossa Storage Zone. O que ela ainda contacta está no TODO.md da demo.
        #
        # `test/architecture_test.dart` do flocks_demo confere que esta flag
        # continua aqui: um gate estático, porque o gate de runtime roda na VM
        # e não enxerga o bootstrap JS que faz esse download.
        run: flutter build web --release --base-href /demo/ --no-web-resources-cdn
        working-directory: packages/flocks_demo

      - name: Podar o que nunca é servido, e medir
        # Os `.symbols` são tabelas de deobfuscação de stack trace: 8,3 MB que
        # nenhum navegador pede jamais. Eles vão para a Storage Zone só porque
        # estão na pasta, e sair daqui não custa nada nem tira funcionalidade.
        #
        # Sobre o número: a anti-referência é o Widgetbook (43 MB, `main.dart.js`
        # de 4,2 MB). Comparar os totais engana, porque o grosso dos dois é o
        # runtime do Flutter, que traz TODAS as variantes de renderer e só uma é
        # baixada. O que separa os dois é o código: 2,1 MB contra 4,2 MB. Por
        # isso o passo reporta os dois números, e o do boot — o que o visitante
        # realmente espera — em vez de só o total do diretório.
        shell: bash
        run: |
          set -euo pipefail
          cd packages/flocks_demo/build/web
          before=$(du -sh . | cut -f1)
          find . -name '*.symbols' -delete
          total=$(du -sh . | cut -f1)
          main=$(du -h main.dart.js | cut -f1)
          boot=$(du -ch index.html flutter_bootstrap.js flutter.js \
            main.dart.js canvaskit/canvaskit.js canvaskit/canvaskit.wasm \
            assets/packages/flocks/assets/fonts/*/*.ttf 2>/dev/null |
            tail -1 | cut -f1)
          echo "Demo: ${total} publicados (${before} antes de podar symbols)."
          echo "main.dart.js ${main} · boot típico ~${boot}"
          {
            echo "### Demo"
            echo "- publicado: **${total}** (${before} antes de podar symbols)"
            echo "- \`main.dart.js\`: **${main}** (Widgetbook: 4,2 MB)"
            echo "- boot típico (canvaskit + fontes): ~${boot}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir build para a Storage Zone, sob demo/
        # Endpoint REGIONAL (br.), como nos outros dois: a zone vive em São
        # Paulo e o host genérico da doc não aceita a escrita. Cada PUT tem o
        # código HTTP conferido: upload parcial tem que ser vermelho.
        #
        # A senha é a da zona `flocks-site` — a MESMA do job `site`, porque é a
        # mesma zona. Não confundir com a do widgetbook, que é de outra.
        shell: bash
        env:
          BUNNY_SITE_STORAGE_PASSWORD: ${{ secrets.BUNNY_SITE_STORAGE_PASSWORD }}
        run: |
          set -euo pipefail
          cd packages/flocks_demo/build/web
          total=0
          while IFS= read -r -d '' f; do
            path="${f#./}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
              -H "AccessKey: ${BUNNY_SITE_STORAGE_PASSWORD}" \
              --data-binary "@${f}" \
              "https://br.storage.bunnycdn.com/flocks-site/demo/${path}")
            if [ "$code" != "201" ]; then
              echo "::error::PUT demo/${path} -> HTTP ${code}"
              exit 1
            fi
            total=$((total + 1))
          done < <(find . -type f -print0)
          echo "Enviados ${total} arquivo(s) para flocks-site sob demo/."

      - name: Purgar cache da Pull Zone
        # Mesma zona do site, então o purge é o mesmo hostname. O `main.dart.js`
        # não tem hash no nome e o edge cacheia por um ano — sem purge, o deploy
        # só existiria na origem.
        id: purge
        shell: bash
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          set -euo pipefail
          zone_id=$(curl -sS -H "AccessKey: ${BUNNY_API_KEY}" \
            "https://api.bunny.net/pullzone" |
            jq '[.[] | select(any(.Hostnames[]; .Value == "flocks.live"))][0].Id')
          if [ -z "$zone_id" ] || [ "$zone_id" = "null" ]; then
            echo "::error::Nenhuma Pull Zone com o hostname flocks.live."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "AccessKey: ${BUNNY_API_KEY}" \
            "https://api.bunny.net/pullzone/${zone_id}/purgeCache")
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::error::Purge da zone ${zone_id} -> HTTP ${code}"
            exit 1
          fi
          # O passo seguinte repurga entre tentativas, e precisa do id sem
          # redescobri-lo por hostname a cada volta.
          echo "zone_id=${zone_id}" >> "$GITHUB_OUTPUT"
          echo "Pull Zone ${zone_id} purgada."

      - name: Conferir que o edge serve o que subiu
        # O mesmo gate do `site`, pelo mesmo script — e este job é o que mais
        # precisava dele: escreve na MESMA Storage Zone do site e purga a MESMA
        # Pull Zone, um segundo depois do último PUT, e até aqui terminava VERDE
        # sem olhar o que `flocks.live/demo/` passou a servir.
        #
        # A lista é o `index.html` e os `*.js` da raiz do build, derivada e não
        # fixa, pela mesma razão do widgetbook: são os que mudam em todo deploy e
        # os que o edge cacheia por um ano sem hash no nome, e um rename do
        # Flutter não pode fazer o passo conferir o vazio. As URLs levam o
        # prefixo `/demo/`, que é o `--base-href` do build.
        shell: bash
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          ZONE_ID: ${{ steps.purge.outputs.zone_id }}
          EDGE_DICA: >-
            Réplica divergente na Storage Zone flocks-site é o suspeito — confira
            no painel da Bunny antes de re-rodar o job.
        run: |
          set -euo pipefail
          dir=packages/flocks_demo/build/web
          if [ ! -f "${dir}/index.html" ]; then
            echo "::error::${dir}/index.html não existe — o build mudou de forma e este gate ficaria conferindo o vazio."
            exit 1
          fi
          pares=''
          while IFS= read -r -d '' f; do
            rel="${f#"${dir}"/}"
            url="/demo/${rel}"
            case "$url" in
              */index.html) url="${url%index.html}" ;;
            esac
            pares="${pares}${url}|${f} "
          done < <(find "$dir" -maxdepth 1 -type f \
            \( -name 'index.html' -o -name '*.js' \) -print0)
          printf '%s' "$pares" |
            bash .github/scripts/conferir-edge.sh https://flocks.live "${ZONE_ID}"

  mcpb-build:
    name: mcpb (${{ matrix.binary }})
    # Compila o servidor MCP como executável nativo, um por plataforma, para o
    # bundle `.mcpb` (ROADMAP, Fase C3): a instalação de um clique no Claude
    # Desktop, e a via de distribuição que não depende do pub.dev.
    # `dart compile exe` NÃO cruza compilação — cada alvo compila no runner da
    # própria plataforma, daí a matriz. O macOS arm64 é PINADO em `macos-26`
    # como no `goldens`; o Intel usa `macos-15-intel`, runner standard e
    # gratuito em repo público até a imagem se aposentar (~2027).
    #
    # Só acorda em tag `v*` (release) ou em dispatch manual (medição e ensaio,
    # sem publicar): em PR o binário não é gate — o `protocol_e2e_test.dart`
    # do `checks` já conversa com ele por stdio a cada PR.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      # O nome COMPLETO do binário vive na matriz porque três pontas o
      # compartilham: o `-o` do compile aqui, o `run.sh` que o monta com
      # `uname` dentro do bundle, e o manifesto (no override win32). O
      # `mcpb_manifest_test.dart` confere que este arquivo cita cada um.
      matrix:
        include:
          - runner: macos-26
            binary: flocks_mcp-darwin-arm64
            arch: arm64
          - runner: macos-15-intel
            binary: flocks_mcp-darwin-x64
            arch: x86_64
          - runner: ubuntu-latest
            binary: flocks_mcp-linux-x64
            arch: x86_64
          - runner: windows-latest
            binary: flocks_mcp-windows-x64.exe
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Conferir a arquitetura do runner
        # Mesma razão do guard do `goldens`: o NOME do binário afirma a
        # arquitetura, e uma imagem promovida em silêncio produziria um
        # `darwin-arm64` que é x64 por dentro — quebrando na máquina de quem
        # instalou, não aqui.
        shell: bash
        run: |
          atual=$(uname -m)
          echo "runner: ${atual} · alvo: ${{ matrix.binary }}"
          if [ "$atual" != "${{ matrix.arch }}" ]; then
            echo "::error::O alvo ${{ matrix.binary }} espera ${{ matrix.arch }} e este runner é ${atual}. Alinhe o \`runs-on\` da matriz."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Resolver dependências (workspace)
        # Flutter, e não só Dart, mesmo sendo o `flocks_mcp` Dart puro: o
        # `resolution: workspace` resolve o workspace INTEIRO, e os pacotes
        # irmãos declaram Flutter. Mesmo SDK e mesmo cache dos outros jobs.
        run: flutter pub get

      - name: Compilar (${{ matrix.binary }})
        shell: bash
        run: dart compile exe bin/flocks_mcp.dart -o ${{ matrix.binary }}
        working-directory: packages/flocks_mcp

      - name: Smoke test por stdio
        # A prova de que ESTE binário sobe e fala JSON-RPC — por pipe real,
        # não pelas funções. No EOF do stdin o servidor responde e sai sozinho
        # (verificado no e2e), então o pipe não pende. A versão conferida vem
        # do pubspec: é a que o `initialize` anuncia ao cliente.
        shell: bash
        run: |
          set -euo pipefail
          ver=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          out=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            | ./${{ matrix.binary }})
          echo "$out"
          case "$out" in
            *'"name":"flocks_mcp"'*'"version":"'"$ver"'"'*) ;;
            *)
              echo "::error::O initialize não devolveu flocks_mcp ${ver}."
              exit 1
              ;;
          esac
        working-directory: packages/flocks_mcp

      - uses: actions/upload-artifact@v4
        # O artifact NÃO preserva permissões (tudo chega 644) — o `+x` volta
        # no chmod do `mcpb-release`, antes do zip.
        with:
          name: ${{ matrix.binary }}
          path: packages/flocks_mcp/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  mcpb-release:
    name: mcpb (bundle + release)
    # Monta o `.mcpb` — zip com `manifest.json` na raiz e binários em
    # `server/` — e o anexa a um GitHub Release junto do SHA-256 e do
    # `server.json` do MCP Registry. O empacotamento é `zip` explícito, SEM a
    # CLI npm `@anthropic-ai/mcpb`: o pipeline não traz Node (mesma regra
    # anti-supply-chain do `widgetbook`), e a validação que o `mcpb pack`
    # faria vive no `test/mcpb_manifest_test.dart`, que roda no `checks` de
    # todo PR. Runner LINUX de propósito (mcpb#235): zip montado no Windows
    # perde os metadados Unix, e quem descompactar fora do Claude Desktop
    # precisa deles.
    #
    # `needs: checks`, e não `goldens`: a suíte inteira do `flocks_mcp`
    # (frescor do catálogo embarcado incluso) tem que estar verde para um
    # release sair; golden compara pixel, e pixel não entra no binário.
    #
    # O Release sai por `gh`, first-party e pré-instalado — nenhuma action de
    # terceiro toca o token, que só este job recebe com `contents: write`.
    # Em dispatch (sem tag) o bundle sai como artifact: medir e ensaiar, sem
    # publicar.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [mcpb-build, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: A tag é a versão do pubspec?
        # Falha ANTES de montar qualquer coisa: uma tag `v0.2.0` sobre um
        # pubspec 0.1.0 publicaria um binário que se apresenta com a versão
        # errada no `initialize` — e o log de todo cliente mentiria por ela.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(grep -E '^version:' packages/flocks_mcp/pubspec.yaml | awk '{print $2}')
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não bate com o pubspec do flocks_mcp (v${ver})."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: flocks_mcp-*
          path: binaries
          merge-multiple: true

      - name: Montar o bundle
        # A lista de `cp` daqui É o conteúdo do `.mcpb`, e tem gate: o
        # `test/mcpb_manifest_test.dart` do flocks_mcp lê este passo e compara os
        # destinos com o esqueleto que o bundle promete. Acrescentar arquivo sem
        # declarar lá, ou tirar um de lá, reprova no `checks` de todo PR.
        run: |
          set -euo pipefail
          mkdir -p bundle/server
          cp packages/flocks_mcp/mcpb/manifest.json bundle/manifest.json
          cp packages/flocks_mcp/mcpb/run.sh bundle/server/run.sh
          cp binaries/flocks_mcp-* bundle/server/
          # O LICENSE vai DENTRO do zip porque este é o único caminho pelo qual
          # os quatro binários compilados chegam a alguém: quem instala pelo
          # Claude Desktop baixa o `.mcpb` de um GitHub Release e nunca passa
          # pelo pub.dev nem pelo repo. Distribuir binário MIT sem o texto da
          # licença é descumprir a própria licença, e o `manifest.json` declara
          # `"license": "MIT"` — a declaração e o arquivo saem juntos ou a
          # declaração é promessa vazia. O `v0.1.1` saiu com 7 entradas no zip e
          # nenhuma era esta.
          cp packages/flocks_mcp/LICENSE bundle/LICENSE
          # O artifact chega sem `+x` (ver o upload); o Info-ZIP grava o modo
          # no campo Unix do zip, e é ele que um `unzip` de verdade restaura.
          # O Claude Desktop ignora o campo e extrai tudo 0600 (mcpb#294) —
          # lá, quem devolve o bit é o `run.sh`; o chmod aqui é para todos os
          # outros caminhos de extração.
          chmod +x bundle/server/run.sh bundle/server/flocks_mcp-*
          (cd bundle && zip -q -r ../flocks-mcp.mcpb .)
          sha256sum flocks-mcp.mcpb > flocks-mcp.mcpb.sha256
          cat flocks-mcp.mcpb.sha256

      - name: Medir os dois desenhos de bundle
        # O número que circula: o bundle único (o publicado) contra o que
        # seriam três bundles por plataforma. Medido a cada release em vez de
        # suposto uma vez — a decisão pelo único está no PR da Fase C3, e se a
        # razão entre os números virar, é aqui que aparece.
        #
        # Os `medida-*` levam o MESMO esqueleto do bundle publicado, `LICENSE`
        # incluso: um bundle por plataforma também teria de carregar a licença
        # (a obrigação é por cópia distribuída), e medir sem ela seria comparar
        # o publicado com um hipotético mais magro do que ele poderia ser.
        run: |
          set -euo pipefail
          ls -la bundle/server/
          du -h flocks-mcp.mcpb
          for alvo in darwin linux windows; do
            mkdir -p "medida-${alvo}/server"
            cp bundle/manifest.json "medida-${alvo}/manifest.json"
            cp bundle/LICENSE "medida-${alvo}/LICENSE"
            cp bundle/server/run.sh "medida-${alvo}/server/run.sh"
            cp bundle/server/flocks_mcp-"${alvo}"-* "medida-${alvo}/server/"
            (cd "medida-${alvo}" && zip -q -r "../medida-${alvo}.mcpb" .)
          done
          du -h medida-*.mcpb
          rm -rf medida-*

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Gerar o server.json do registry
        # O sha entra vindo do MESMO arquivo que o Release anexa — é o que
        # impede o hash publicado de divergir do artefato. O registry não
        # valida o hash; os CLIENTES validam antes de instalar.
        run: |
          set -euo pipefail
          flutter pub get
          sha=$(awk '{print $1}' flocks-mcp.mcpb.sha256)
          (cd packages/flocks_mcp && dart run tool/generate_server_json.dart "$sha") > server.json
          cat server.json

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(awk '{print $1}' flocks-mcp.mcpb.sha256)
          {
            echo "MCP Bundle do \`flocks_mcp\` — o catálogo do Flocks servido a agentes por stdio. Instalação em dois cliques no Claude Desktop (baixar, abrir), com binários para macOS (arm64/x64), Linux (x64) e Windows (x64) selecionados pelo bundle."
            echo
            echo "SHA-256 do \`flocks-mcp.mcpb\` (o que um cliente MCP confere antes de instalar):"
            echo
            echo '```'
            echo "${sha}"
            echo '```'
            echo
            echo "O \`server.json\` anexo é o manifesto desta versão para o MCP Registry. Instruções completas em https://flocks.live/mcp/."
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" \
            flocks-mcp.mcpb flocks-mcp.mcpb.sha256 server.json \
            --title "flocks_mcp ${GITHUB_REF_NAME}" \
            --notes-file notes.md

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: flocks-mcp-bundle
          path: |
            flocks-mcp.mcpb
            flocks-mcp.mcpb.sha256
            server.json
          retention-days: 7

  site:
    name: site (deploy)
    # Publica a landing em flocks.live. Mesmo padrão anti-supply-chain do
    # `widgetbook` (find + curl explícitos, sem action de terceiro), com duas
    # divergências deliberadas:
    #
    # 1. SEM `needs`: o site é HTML estático e não depende dos gates Dart —
    #    um golden vermelho não deve segurar a correção de um typo da landing.
    #    (O conteúdo dele TEM gate: `install_docs_test.dart` fiscaliza a copy
    #    de instalação das duas páginas junto com a do README.)
    # 2. Guarda de diff: sem build, todo push da main deployaria e purgaria o
    #    edge à toa; o job só age quando `site/` mudou neste push. O
    #    `workflow_dispatch` tem `force_site` para atropelá-la à mão.
    #
    # A senha de Storage Zone da Bunny é POR ZONA — `BUNNY_SITE_STORAGE_PASSWORD`
    # é da zona `flocks-site`, não confundir com a do widgetbook. Caveat aceito,
    # igual ao do widgetbook: o job só sobe e sobrescreve, não apaga órfãos.
    #
    # `github.ref` pela mesma razão do `widgetbook`: push de tag não deploya.
    #
    # DOIS JOBS ESCREVEM NESTA ZONE. Este, sem `needs`, começa na hora; o `demo`,
    # com `needs: [checks, goldens]`, começa minutos depois — e os dois purgam o
    # MESMO hostname. A separação de prefixo (`/` aqui, `demo/` lá) evita conflito
    # de conteúdo, e um purge tardio do `demo` é inofensivo para as páginas daqui:
    # ele só limpa o edge, que então recarrega de uma origem já correta. O que NÃO
    # é inofensivo é a ordem inversa dentro de um job só — purgar antes de a
    # origem assentar —, e é disso que trata o último passo.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro, e não `fetch-depth: 2`, porque a guarda abaixo
          # compara contra `github.event.before` — o commit anterior ao PUSH, que
          # num push de vários commits está mais de um passo atrás. São 69
          # commits e 28 MB de `.git`: o clone completo é mais barato que a
          # aritmética de fetch parcial que o `before` exigiria.
          fetch-depth: 0

      - name: Site mudou neste push?
        id: changed
        env:
          FORCE_SITE: ${{ inputs.force_site }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${FORCE_SITE:-}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "force_site pedido à mão — deployando sem olhar o diff."
            exit 0
          fi
          # A base é `github.event.before`, o estado da branch ANTES do push, e
          # não `HEAD^`. Com `HEAD^` a comparação é tip contra primeiro pai, e um
          # push de dois commits em que `site/` mudou no de BAIXO passava batido:
          # `git diff` entre os dois de cima vem vazio, a guarda dizia "intacto"
          # e o job saía verde sem ter subido a mudança. Merge de PR não sofria
          # (o primeiro pai é a main anterior), push direto de série sofria.
          base=""
          if [ -n "${BEFORE:-}" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="HEAD^"
          fi
          # A cadeia é `before` → `HEAD^` → deployar. O degrau do meio preserva o
          # comportamento antigo onde `before` não existe (é o caso do
          # `workflow_dispatch`, que por isso tem `force_site`), e o último é
          # fail-open de verdade, para o commit-raiz. Errar para o lado de
          # deployar custa um purge; errar para o outro custa o site errado no ar,
          # que é o que aconteceu em 2026-08-10.
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- site/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "site/ intacto — nada a deployar."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Subir site para a Storage Zone
        # Endpoint REGIONAL (br.), como no widgetbook: a zone vive em São
        # Paulo e o host genérico da doc não aceita a escrita. Cada PUT tem o
        # código HTTP conferido: upload parcial tem que ser vermelho.
        #
        # O `total` sai como output porque o último passo confere a lista dele
        # contra a que subiu aqui — é o que impede os dois `find` de divergirem.
        id: upload
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        env:
          BUNNY_SITE_STORAGE_PASSWORD: ${{ secrets.BUNNY_SITE_STORAGE_PASSWORD }}
        run: |
          set -euo pipefail
          cd site
          total=0
          while IFS= read -r -d '' f; do
            path="${f#./}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
              -H "AccessKey: ${BUNNY_SITE_STORAGE_PASSWORD}" \
              --data-binary "@${f}" \
              "https://br.storage.bunnycdn.com/flocks-site/${path}")
            if [ "$code" != "201" ]; then
              echo "::error::PUT ${path} -> HTTP ${code}"
              exit 1
            fi
            total=$((total + 1))
          done < <(find . -type f -print0)
          echo "Enviados ${total} arquivo(s) para flocks-site."
          echo "total=${total}" >> "$GITHUB_OUTPUT"

      - name: Purgar cache da Pull Zone
        id: purge
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          set -euo pipefail
          zone_id=$(curl -sS -H "AccessKey: ${BUNNY_API_KEY}" \
            "https://api.bunny.net/pullzone" |
            jq '[.[] | select(any(.Hostnames[]; .Value == "flocks.live"))][0].Id')
          if [ -z "$zone_id" ] || [ "$zone_id" = "null" ]; then
            echo "::error::Nenhuma Pull Zone com o hostname flocks.live."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "AccessKey: ${BUNNY_API_KEY}" \
            "https://api.bunny.net/pullzone/${zone_id}/purgeCache")
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::error::Purge da zone ${zone_id} -> HTTP ${code}"
            exit 1
          fi
          # O passo seguinte repurga entre tentativas, e precisa do id sem
          # redescobri-lo por hostname a cada volta.
          echo "zone_id=${zone_id}" >> "$GITHUB_OUTPUT"
          echo "Pull Zone ${zone_id} purgada."

      - name: Conferir que o edge serve o que subiu
        # O laço vive em `.github/scripts/conferir-edge.sh` — narrativa do
        # incidente de 2026-08-10, orçamento de espera e repurge estão lá,
        # porque os três jobs que purgam esta Pull Zone usam o MESMO laço e um
        # gate só vale se for igual nos três.
        #
        # O que é específico daqui é a LISTA. Ela sai do mesmo `find site -type
        # f` do upload, e não de URLs escolhidas à mão: o passo nasceu conferindo
        # 4 dos 18 arquivos que sobem, e uma réplica divergente no
        # `assets/style.css` (10.323 B, sem hash no nome, cacheado por um ano)
        # deixaria o site sem estilo com este job VERDE — a mesma classe de falha
        # que o script narra, num arquivo que ninguém tinha listado.
        #
        # Duas exclusões, as únicas: `404.html` não tem URL própria (a Pull Zone
        # o serve como corpo de erro) e `assets/og.html` é o fonte de onde o
        # `og-image.png` foi rasterizado, publicado só para quem quiser refazer
        # a imagem. Elas são CONTADAS, e a soma tem de fechar com o total do
        # upload: é isso que impede os dois `find` de divergirem em silêncio.
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          ZONE_ID: ${{ steps.purge.outputs.zone_id }}
          ENVIADOS: ${{ steps.upload.outputs.total }}
          EDGE_DICA: >-
            Réplica divergente na Storage Zone flocks-site é o suspeito —
            confira no painel da Bunny antes de re-rodar com force_site.
        run: |
          set -euo pipefail
          # "URL que o visitante abre|arquivo que a serve", um par por linha.
          pares=''
          excluidos=0
          while IFS= read -r -d '' f; do
            rel="${f#site/}"
            case "$rel" in
              404.html | assets/og.html)
                excluidos=$((excluidos + 1))
                continue
                ;;
            esac
            url="/${rel}"
            # `site/pt/index.html` é servido em `/pt/`, e é entre as duas formas
            # que a divergência de 2026-08-10 se escondeu: conferir `/pt/` é
            # conferir o que o visitante abre.
            case "$url" in
              */index.html) url="${url%index.html}" ;;
            esac
            pares="${pares}${url}|${f} "
          done < <(find site -type f -print0)
          n=$(printf '%s\n' $pares | grep -c .)
          if [ "$((n + excluidos))" != "${ENVIADOS}" ]; then
            echo "::error::A lista de conferência (${n} pares + ${excluidos} exclusões) não fecha com os ${ENVIADOS} arquivos que subiram — o find deste passo divergiu do find do upload."
            exit 1
          fi
          echo "${n} URL(s) a conferir, ${excluidos} exclusão(ões), ${ENVIADOS} arquivo(s) no ar."
          printf '%s' "$pares" |
            bash .github/scripts/conferir-edge.sh https://flocks.live "${ZONE_ID}"
