name: flocks
description: "Flocks — a Flutter design system built on widgets.dart: design tokens, theme and brand (white-label)."
# 0.x, e não 1.0.0, por uma razão só: 1.0.0 no pub.dev é promessa sobre o
# FUTURO, não atestado sobre o passado. O pacote tem 131 componentes testados e
# documentados, mas nunca encarou um consumidor externo, levou um
# `refactor(flocks)!` no dia da extração e roda a ~65 commits por quinzena.
# Em 0.x o SemVer trata o MINOR como slot de quebra, então `^0.1.0` resolve
# para `>=0.1.0 <0.2.0` e todo adotante já sai pinado contra o churn.
#
# 0.x → 1.0.0 é formatura que se anuncia; 1.0.0 → 2.0.0 → 3.0.0 num trimestre é
# instabilidade que não se retrata — no pub.dev só existe `retract`.
#
# O catálogo carregava os mesmos marcos num campo `since:`; eram INTERNOS de
# migração, anteriores a qualquer publicação, e já divergiam deste campo antes
# da extração (a régua chegou a 1.5.0 com o pubspec em 1.0.0). Ver CHANGELOG.
version: 0.1.2

repository: https://github.com/jotapeconsultoria/flocks/tree/main/packages/flocks
homepage: https://flocks.live
issue_tracker: https://github.com/jotapeconsultoria/flocks/issues

resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.3.1
  flutter_svg: ^2.2.3
  # Parsers Dart PUROS (sem Flutter/Material) usados pelos organisms de conteúdo
  # (AppMarkdown/AppHtml). Só produzem AST/DOM — o render é 100% nosso, sobre
  # widgets.dart. NÃO trocar por flutter_html: ele exige ancestral Material.
  html: ^0.15.4
  markdown: ^7.3.0
  material_color_utilities: ^0.13.0
  # `@internal`: marca o widget que existe só como peça de outro componente.
  # O analisador então proíbe usá-lo fora do pacote E exportá-lo no baril
  # público — a fronteira deixa de ser convenção e vira erro de compilação.
  meta: ^1.16.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  # Bindings de DOM sobre `dart:js_interop`, usadas SÓ pelo ramo web da fachada
  # de interceptação de ponteiro (`src/foundation/pointer/`). Entraram como
  # substitutas do `pointer_interceptor`, que saiu na 0.1.1: aquele era plugin
  # federado endossando só `web` e `ios`, e o pana intersecta as plataformas de
  # todo o fecho de dependências — uma linha rebaixava o flocks e os dois
  # adaptadores a "Supports 2 of 6 platforms" no pub.dev.
  #
  # Esta NÃO reintroduz o teto: o `web` é Dart puro, sem sequer uma seção
  # `flutter:` no pubspec, quanto mais um `plugin:`. Faixa larga de propósito —
  # é a mesma que o `http` e o antigo `pointer_interceptor_web` usam, e a API
  # consumida aqui (HTMLElement, Event, addEventListener) existe desde a 0.5.1.
  # Estreitar só criaria conflito para quem já depende de `web` por outro
  # caminho.
  web: ">=0.5.1 <2.0.0"

dev_dependencies:
  build_runner: ^2.4.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  widgetbook: ^3.0.0
  widgetbook_annotation: ^3.0.0
  widgetbook_generator: ^3.0.0

flutter:
  # Necessário para os ícones da UI do catálogo Widgetbook (tooling). NÃO muda
  # o design system: os componentes do flocks não importam Material (garantido
  # pelo teste de arquitetura); isto só bundla MaterialIcons no build do catálogo.
  uses-material-design: true

  # Os 55 ícones do contrato ([AppIconToken]), servidos pelo provider padrão sem
  # tocar a rede. São do Phosphor Icons (MIT) — a licença e a tradução de cada
  # nome estão em `assets/icons/`.
  assets:
    - assets/icons/
    - assets/illustrations/
  # Só fontes redistribuíveis: as três famílias são SIL Open Font License 1.1, e
  # a OFL exige que o texto da licença acompanhe a fonte — daí o `OFL.txt` ao
  # lado de cada uma. Não acrescente família sem verificar a licença: a Neutrek
  # saiu daqui por ser "Personal Use Only", o que tornava o pacote impublicável.
  #
  # A IBM Plex Mono é a família de código de `AppContentStyle`, e está aqui por
  # dois motivos que convergem. Um: sem mono empacotada o pacote dependia da
  # mono do SO (`SF Mono`, `Menlo`, `Consolas`, …), o que tornava todo golden de
  # código dependente de plataforma. Dois: no CanvasKit, uma pilha de famílias
  # NÃO registradas faz cada codepoint sem cobertura entrar na fila de fallback
  # do engine — e um acento de comentário em português bastava para baixar
  # 69.116 B de Noto Sans Symbols de `fonts.gstatic.com` (medido em produção,
  # PR #20). Família registrada, gatilho morto.
  #
  # Dois pesos porque são exatamente os dois que o pacote usa: 400 em todo bloco
  # e código inline, 600 nos placeholders de `AppApiPath`. Sem itálico — o case
  # `code` do inline builder não herda o estilo do pai, então mono itálica nunca
  # é pedida.
  #
  # Procedência: `google/fonts`, `ofl/ibmplexmono`, Version 2.3 (upstream
  # `googlefonts/plex` @ 9ab3b5b3b96325fb20f365ee0804adca92024cbf). Estáticas, e
  # não a variável: `weight:` aqui só escolhe QUAL arquivo atende o peso pedido,
  # não move eixo de variação — com uma variável, o w600 cairia no peso padrão
  # do arquivo. É também o motivo de a escolha ter sido esta família: em
  # 2026-08-11 ela era a única mono do `google/fonts` que ainda publica
  # estáticas com SemiBold 600 real; as demais viraram só variável.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-Medium.ttf
          weight: 500
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-SemiBold.ttf
          weight: 600
